<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EasyStock - Inventory Management System</title>
  <link rel="stylesheet" href="css/index.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/inventory.css">
  <link rel="stylesheet" href="css/logs.css">
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased">
  <div id="auth-container" class="min-h-screen flex items-center justify-center p-4">

  </div>
  <div id="app-container" class="hidden min-h-screen flex flex-col md:flex-row">
    <aside class="w-full md:w-64 bg-slate-900 text-white p-6 flex flex-col justify-between">
      <div>
        <h1 class="text-2xl font-bold tracking-wide text-indigo-400 mb-8">EasyStock</h1>
        <nav class="space-y-2">
          <button id="nav-dashboard" class="w-full text-left py-2.5 px-4 rounded hover:bg-slate-800 transition font-medium text-slate-300">Dashboard</button>
          <button id="nav-inventory" class="w-full text-left py-2.5 px-4 rounded hover:bg-slate-800 transition font-medium text-slate-300">Inventory</button>
          <button id="nav-stock" class="w-full text-left py-2.5 px-4 rounded hover:bg-slate-800 transition font-medium text-slate-300">Stock Operations</button>
          <button id="nav-logs" class="w-full text-left py-2.5 px-4 rounded hover:bg-slate-800 transition font-medium text-slate-300">Activity Logs</button>
        </nav>
      </div>
      <div class="pt-6 border-t border-slate-800 flex items-center justify-between">
        <span id="user-display" class="text-sm text-slate-400 font-medium truncate">User</span>
        <button id="btn-logout" class="text-xs bg-red-600 hover:bg-red-700 text-white py-1.5 px-3 rounded transition font-semibold">Logout</button>
      </div>
    </aside>
    <main class="flex-1 p-8 overflow-y-auto">
      <div id="tab-content"></div>
    </main>
  </div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
