<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EasyStock System - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/css/index.css">
</head>
<body class="flex items-center justify-center h-screen bg-slate-100">

    <div class="w-full max-w-md bg-white p-8 rounded-xl shadow-lg border border-slate-200">
        <div class="text-center mb-6">
            <h2 class="text-2xl font-bold text-slate-900 mb-1">EasyStock System</h2>
            <p class="text-slate-500 text-sm">Please sign in to your account</p>
        </div>

        <form id="loginForm" class="space-y-4">
            <div>
                <label for="username" class="block mb-1.5 font-semibold text-slate-700 text-xs uppercase tracking-wider">Username</label>
                <input type="text" id="username" name="username" required class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-lg text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500">
            </div>

            <div>
                <label for="password" class="block mb-1.5 font-semibold text-slate-700 text-xs uppercase tracking-wider">Password</label>
                <input type="password" id="password" name="password" required class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-lg text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500">
            </div>

            <button type="submit" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold rounded-lg text-sm transition shadow-sm">
                Sign In
            </button>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    // Save mock/session token or status so dashboard check passes
                    localStorage.setItem('authToken', 'active_session');
                    localStorage.setItem('userId', data.userId);
                    localStorage.setItem('role', data.role);
                    localStorage.setItem('username', username);
                    
                    window.location.href = '/dashboard.html'; 
                } else {
                    alert(data.error || 'Login failed');
                }
            } catch (error) {
                console.error('Login error:', error);
                alert('An error occurred during login. Please try again.');
            }
        });
    </script>
</body>
</html>
