<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EasyStock</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; margin: 0; background: #f5f7fa; color: #222; }
    header { background: #1f6feb; color: #fff; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; }
    header h2 { margin: 0; font-size: 1.1rem; }
    #who { font-size: .85rem; }
    nav { display: flex; gap: 8px; padding: 12px; flex-wrap: wrap; }
    button { padding: 8px 14px; border: 0; border-radius: 6px; background: #e1e8f0; cursor: pointer; font-size: 1rem; }
    button.active, button.primary { background: #1f6feb; color: #fff; }
    main { padding: 0 12px 24px; overflow-x: auto; }
    table { border-collapse: collapse; width: 100%; background: #fff; }
    th, td { padding: 8px 10px; border-bottom: 1px solid #e5e5e5; text-align: left; white-space: nowrap; }
    th { background: #f0f3f7; text-transform: capitalize; }
    .low { color: #c0392b; font-weight: 600; }
    .hidden { display: none; }
    #login { max-width: 340px; margin: 48px auto; background: #fff; padding: 24px; border-radius: 10px; box-shadow: 0 2px 10px rgba(0,0,0,.08); }
    #login h2 { margin-top: 0; }
    #login input { width: 100%; padding: 10px; margin: 6px 0 14px; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem; }
    #login button { width: 100%; }
    #error { color: #c0392b; margin-bottom: 10px; min-height: 1.2em; }
  </style>
</head>
<body>

  <!-- Login screen -->
  <section id="login">
    <h2>EasyStock Login</h2>
    <label>Username<input id="username" autocomplete="username"></label>
    <label>Password<input id="password" type="password" autocomplete="current-password"></label>
    <div id="error"></div>
    <button class="primary" id="loginBtn">Log in</button>
  </section>

  <!-- App screen (shownn after login) -->
  <section id="app" class="hidden">
    <header>
      <h2>EasyStock</h2>
      <div><span id="who"></span> <button id="logoutBtn">Log out</button></div>
    </header>
    <nav id="nav"></nav>
    <main><table id="table"></table></main>
  </section>

  <script>
    const $ = (id) => document.getElementById(id);
    let token = localStorage.getItem('token');

    // Which tabs each role can see
    const TABS = {
      admin:      ['products', 'stock', 'requisitions', 'users'],
      staff:      ['products', 'stock', 'requisitions'],
      department: ['products', 'requisitions'],
    };

    async function api(path, options = {}) {
      const res = await fetch('/api/' + path, {
        ...options,
        headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
      });
      if (res.status === 401) { logout(); throw new Error('Please log in again'); }
      return res.json();
    }

    async function login() {
      $('error').textContent = '';
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: $('username').value.trim(), password: $('password').value }),
      });
      const data = await res.json();
      if (!res.ok) { $('error').textContent = data.error; return; }
      token = data.token;
      localStorage.setItem('token', token);
      localStorage.setItem('user', JSON.stringify(data.user));
      showApp();
    }

    function logout() {
      localStorage.removeItem('token');
      localStorage.removeItem('user');
      token = null;
      $('app').classList.add('hidden');
      $('login').classList.remove('hidden');
      $('password').value = '';
    }

    function showApp() {
      const user = JSON.parse(localStorage.getItem('user'));
      $('login').classList.add('hidden');
      $('app').classList.remove('hidden');
      $('who').textContent = `${user.full_name} (${user.role})`;

      $('nav').innerHTML = TABS[user.role]
        .map((t, i) => `<button data-view="${t}" class="${i === 0 ? 'active' : ''}">${t}</button>`)
        .join('');
      document.querySelectorAll('#nav button').forEach((btn) =>
        btn.addEventListener('click', () => {
          document.querySelectorAll('#nav button').forEach((b) => b.classList.remove('active'));
          btn.classList.add('active');
          load(btn.dataset.view);
        })
      );
      load(TABS[user.role][0]);
    }

    async function load(view) {
      const rows = await api(view);
      if (!Array.isArray(rows) || !rows.length) {
        $('table').innerHTML = '<tr><td>No data</td></tr>';
        return;
      }
      const cols = Object.keys(rows[0]);
      $('table').innerHTML =
        '<tr>' + cols.map((c) => `<th>${c.replace(/_/g, ' ')}</th>`).join('') + '</tr>' +
        rows.map((r) =>
          '<tr>' + cols.map((c) => {
            const cls = r[c] === 'REORDER' ? ' class="low"' : '';
            return `<td${cls}>${r[c] ?? ''}</td>`;
          }).join('') + '</tr>'
        ).join('');
    }

    $('loginBtn').addEventListener('click', login);
    $('password').addEventListener('keydown', (e) => { if (e.key === 'Enter') login(); });
    $('logoutBtn').addEventListener('click', logout);

    if (token && localStorage.getItem('user')) showApp();
  </script>
</body>
</html>
